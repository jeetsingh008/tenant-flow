<div class="detail-container">
    <button class="back-btn" routerLink="/">← Back to Dashboard</button>

     @if(isLoading()){
      <div class="loading-text">Loading tenant details...</div>
     } @else if(tenantDetails()){
      <div class="card">
        <h2>{{ tenantDetails().name }}</h2>
        <div class="info-grid">
          <div class="info-item">
            <span class="label">Email</span>
            <span class="value">{{ tenantDetails().email }}</span>
          </div>
          <div class="info-item">
            <span class="label">Phone</span>
            <span class="value">{{ tenantDetails().phone }}</span>
          </div>
          <div class="info-item">
            <span class="label">Website</span>
            <span class="value">{{ tenantDetails().website }}</span>
          </div>
          <div class="info-item">
            <span class="label">Company</span>
            <span class="value">{{ tenantDetails().company.name }}</span>
          </div>
        </div>
        <div class="catchphrase">
          {{ tenantDetails().company.catchPhrase }}
        </div>
      </div>
     }
</div>
