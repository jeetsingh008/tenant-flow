<div class="w-full max-w-[650px] mx-auto">
    <button class="inline-flex items-center bg-transparent text-gray-500 dark:text-[#a1a1aa] border border-gray-300 dark:border-[#333333] py-1.5 px-3 rounded-md font-medium text-sm mb-8 cursor-pointer transition-colors duration-150 hover:bg-gray-100 dark:hover:bg-[#1a1a1a] hover:text-gray-900 dark:hover:text-[#ededed] no-underline" routerLink="/">← Back to Dashboard</button>

     @if(isLoading()){
      <div class="py-8 text-gray-500 dark:text-[#a1a1aa] text-[0.95rem] transition-colors duration-200">Loading tenant details...</div>
     } @else if(tenantDetails()){
      <div class="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-[#333333] rounded-xl p-10 shadow-sm dark:shadow-none transition-colors duration-200">
        <h2 class="text-2xl font-semibold m-0 mb-8 text-gray-900 dark:text-[#ededed] transition-colors duration-200">{{ tenantDetails().name }}</h2>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-6">
          <div class="flex flex-col gap-1">
            <span class="text-gray-500 dark:text-[#a1a1aa] text-xs font-medium uppercase tracking-wider transition-colors duration-200">Email</span>
            <span class="text-[0.95rem] text-gray-800 dark:text-[#ededed] transition-colors duration-200">{{ tenantDetails().email }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-gray-500 dark:text-[#a1a1aa] text-xs font-medium uppercase tracking-wider transition-colors duration-200">Phone</span>
            <span class="text-[0.95rem] text-gray-800 dark:text-[#ededed] transition-colors duration-200">{{ tenantDetails().phone }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-gray-500 dark:text-[#a1a1aa] text-xs font-medium uppercase tracking-wider transition-colors duration-200">Website</span>
            <span class="text-[0.95rem] text-gray-800 dark:text-[#ededed] transition-colors duration-200">{{ tenantDetails().website }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-gray-500 dark:text-[#a1a1aa] text-xs font-medium uppercase tracking-wider transition-colors duration-200">Company</span>
            <span class="text-[0.95rem] text-gray-800 dark:text-[#ededed] transition-colors duration-200">{{ tenantDetails().company.name }}</span>
          </div>
        </div>
        <div class="mt-10 pt-6 border-t border-gray-200 dark:border-[#333333] text-base text-gray-600 dark:text-[#a1a1aa] transition-colors duration-200">
          {{ tenantDetails().company.catchPhrase }}
        </div>
      </div>
     }
</div>
