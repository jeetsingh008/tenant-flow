<div class="w-full max-w-[650px] mx-auto">
    <button class="inline-flex items-center bg-transparent text-[#a1a1aa] border border-[#333333] py-1.5 px-3 rounded-md font-medium text-sm mb-8 cursor-pointer transition-colors duration-150 hover:bg-[#1a1a1a] hover:text-[#ededed] no-underline" routerLink="/">← Back to Dashboard</button>

     @if(isLoading()){
      <div class="py-8 text-[#a1a1aa] text-[0.95rem]">Loading tenant details...</div>
     } @else if(tenantDetails()){
      <div class="bg-[#1a1a1a] border border-[#333333] rounded-xl p-10">
        <h2 class="text-2xl font-semibold m-0 mb-8 text-[#ededed]">{{ tenantDetails().name }}</h2>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(200px,1fr))] gap-6">
          <div class="flex flex-col gap-1">
            <span class="text-[#a1a1aa] text-xs font-medium uppercase tracking-wider">Email</span>
            <span class="text-[0.95rem] text-[#ededed]">{{ tenantDetails().email }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-[#a1a1aa] text-xs font-medium uppercase tracking-wider">Phone</span>
            <span class="text-[0.95rem] text-[#ededed]">{{ tenantDetails().phone }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-[#a1a1aa] text-xs font-medium uppercase tracking-wider">Website</span>
            <span class="text-[0.95rem] text-[#ededed]">{{ tenantDetails().website }}</span>
          </div>
          <div class="flex flex-col gap-1">
            <span class="text-[#a1a1aa] text-xs font-medium uppercase tracking-wider">Company</span>
            <span class="text-[0.95rem] text-[#ededed]">{{ tenantDetails().company.name }}</span>
          </div>
        </div>
        <div class="mt-10 pt-6 border-t border-[#333333] text-base text-[#a1a1aa]">
          {{ tenantDetails().company.catchPhrase }}
        </div>
      </div>
     }
</div>
