@if (toastService.toast(); as currentToast) {
  <div class="fixed bottom-6 right-6 z-50">
    <div 
      class="flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg border transition-colors duration-200"
      [class]="currentToast.type === 'success' ? 'bg-green-100 dark:bg-[#1a1a1a] border-green-200 dark:border-green-500/30 text-green-800 dark:text-green-400' : 'bg-red-100 dark:bg-[#1a1a1a] border-red-200 dark:border-red-500/30 text-red-800 dark:text-red-400'"
    >
      @if (currentToast.type === 'success') {
        <!-- Success Check Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      } @else {
        <!-- Error Alert Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      }
      <span class="font-medium text-sm">{{ currentToast.text }}</span>
    </div>
  </div>
}
